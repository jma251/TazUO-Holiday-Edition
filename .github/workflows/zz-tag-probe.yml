# Temporary. Can a tag named "latest" be brought back by any route?
name: zz tag probe

on:
  push:
    branches: [legacy]
    paths: ['.github/workflows/zz-tag-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe every route
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          SHA=$(git rev-parse HEAD)

          echo "=================================================="
          echo "1. git push of a lightweight tag (git protocol, not the API)"
          if git push origin "$SHA:refs/tags/latest" 2>&1 | sed 's/^/    /'; then
            echo "  >>> PUSH REPORTED OK"
          else
            echo "  >>> PUSH FAILED"
          fi
          echo "  does it exist now?"
          gh api "repos/$R/git/refs/tags/latest" --jq '.ref' 2>&1 | sed 's/^/    /'

          echo
          echo "=================================================="
          echo "2. git push of an ANNOTATED tag"
          git config user.email a@b.c; git config user.name probe
          git tag -f -a latest -m "probe" "$SHA" 2>&1 | sed 's/^/    /'
          git push -f origin refs/tags/latest 2>&1 | sed 's/^/    /' || echo "    failed"
          gh api "repos/$R/git/refs/tags/latest" --jq '.ref' 2>&1 | sed 's/^/    /'

          echo
          echo "=================================================="
          echo "3. gh release create latest"
          gh release create latest --title "probe" --notes "probe" --target "$SHA" 2>&1 | sed 's/^/    /' || true

          echo
          echo "=================================================="
          echo "4. is it this exact name, or a pattern? (control names)"
          for t in Latest latest2 the-latest; do
            if gh api --method POST "repos/$R/git/refs" -f ref="refs/tags/$t" -f sha="$SHA" >/dev/null 2>&1; then
              echo "  $t : CREATED"
              gh api --method DELETE "repos/$R/git/refs/tags/$t" >/dev/null 2>&1
            else
              echo "  $t : refused"
            fi
          done

          echo
          echo "=================================================="
          echo "5. final state"
          gh api "repos/$R/git/refs/tags/latest" 2>&1 | sed 's/^/    /' | head -3
          gh api "repos/$R/releases" --paginate \
            --jq '.[] | select(.tag_name=="latest") | "    release id=\(.id) draft=\(.draft)"' || echo "    no release claims it"
