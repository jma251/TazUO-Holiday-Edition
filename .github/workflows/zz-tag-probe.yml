# Temporary. Answers one question: what exactly refuses to create the tag
# "latest"? Delete this file once the answer is known.
name: zz tag probe

on:
  push:
    branches: [legacy]
    paths: ['.github/workflows/zz-tag-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          SHA=$(git rev-parse HEAD)

          probe_tag () {
            echo "--------------------------------------------------"
            echo "TAG: $1"
            if out=$(gh api --method POST "repos/$R/git/refs" \
                      -f ref="refs/tags/$1" -f sha="$SHA" 2>&1); then
              echo "  CREATED OK"
              gh api --method DELETE "repos/$R/git/refs/tags/$1" >/dev/null 2>&1 \
                && echo "  deleted again" || echo "  could NOT delete"
            else
              echo "  REFUSED:"
              echo "$out" | sed 's/^/    /'
            fi
          }

          echo "=================================================="
          echo "Clearing every release that claims the tag 'latest':"
          gh api "repos/$R/releases" --paginate \
            --jq '.[] | select(.tag_name=="latest") | .id' \
            | while read -r id; do
                [ -z "$id" ] && continue
                gh api --method DELETE "repos/$R/releases/$id" && echo "  deleted release $id"
              done
          echo "  remaining:"
          gh api "repos/$R/releases" --paginate \
            --jq '.[] | select(.tag_name=="latest") | "    id=\(.id) draft=\(.draft)"' || true

          echo
          echo "=================================================="
          echo "Can this repo create tags at all?"
          probe_tag "zz-probe-ordinary"

          echo
          echo "=================================================="
          echo "Can it create the tag 'latest' specifically?"
          probe_tag "latest"

          echo
          echo "=================================================="
          echo "Does a tag named 'latest' exist right now?"
          gh api "repos/$R/git/refs/tags/latest" 2>&1 | sed 's/^/  /' | head -5

          echo
          echo "=================================================="
          echo "Every release currently claiming the tag 'latest':"
          gh api "repos/$R/releases" --paginate \
            --jq '.[] | select(.tag_name=="latest") | "  id=\(.id) draft=\(.draft) assets=\(.assets|length)"' \
            || echo "  none"
