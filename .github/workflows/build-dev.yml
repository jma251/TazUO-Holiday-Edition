name: Build Dev

# Builds the development branch, legacy, and publishes it as a separate,
# disposable download for testing. It is deliberately kept away from the
# release path: it never touches the "latest" release and never mints a
# numbered version. Only build-release.yml, running off release, does either.

on:
  # Every push to the development branch produces a fresh testable client.
  push:
    branches: [legacy]
  # Allow starting a dev build by hand from the Actions tab.
  workflow_dispatch:

# Separate from build-legacy's group on purpose: a dev build must never cancel
# a release build, or the other way round.
concurrency:
  group: build-legacy
  cancel-in-progress: true

permissions:
  contents: write

env:
  CUO_PROJECT_PATH: 'src/ClassicUO.Client/ClassicUO.Client.csproj'
  CUO_OUTPUT_PATH: 'bin/dist'
  # Deliberately does not start with "TazUO". The launcher falls back to picking
  # any asset whose filename starts with that, so keeping the dev zip out of that
  # namespace means it can never be mistaken for a release download.
  CUO_ZIP_NAME: 'HolidayEdition-Dev.zip'
  # Not "dev": a tag by that name would collide with the inherited dev branch and
  # make "git checkout dev" ambiguous.
  # Never reuse a tag name a release has already published under. GitHub
  # reserves such a name permanently - "tag_name was used by an immutable
  # release" - and no setting undoes it. "latest" and "dev-latest" are both
  # spent. This one is created once, below, and then never deleted, so it
  # cannot be spent in turn.
  TAG_NAME: 'dev-build'

  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Always build legacy, whether triggered by push or by hand.
      - name: Check out legacy branch
        uses: actions/checkout@v4
        with:
          ref: legacy
          fetch-depth: 0

      - name: Check out submodules (recursive)
        run: |
          git config --global url."https://".insteadOf git://
          git submodule update --init --recursive

      - name: Extract version and commit
        shell: bash
        run: |
          export LC_ALL=C.UTF-8
          echo "VERSION=$(grep -oP '<AssemblyVersion>\K\d+\.\d+\.\d+' src/ClassicUO.Client/ClassicUO.Client.csproj | head -1)" >> $GITHUB_ENV
          echo "DEV_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          # The release is updated in place rather than recreated, so GitHub's
          # "released this N hours ago" is the date it was first made and never
          # moves. Without this there is nothing on the page that says when the
          # build you are about to download was actually produced.
          echo "BUILT_AT=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      # What is on legacy that has not been released yet. This is the useful
      # thing to read on a dev build: it is the list of what is being tested.
      - name: Build release notes
        shell: bash
        run: |
          export LC_ALL=C.UTF-8

          # Against release, not legacy. This ran as origin/legacy..HEAD, which
          # on a legacy build is the branch against itself - always empty, so
          # every dev build said there was nothing in it.
          git fetch origin release --quiet || true

          LOG=$(git log --no-merges --pretty=format:'- %s (%h)' origin/release..HEAD 2>/dev/null || true)

          if [ -z "$LOG" ]; then
            LOG="- Nothing here that is not already released."
          fi

          {
            echo "NOTES<<HOLIDAY_NOTES_EOF"
            echo "Ahead of \`release\` (not yet released):"
            echo ""
            echo "$LOG"
            echo "HOLIDAY_NOTES_EOF"
          } >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The commit is stamped into the binary so a crash log from a dev build says
      # which dev build. CUOEnviroment.ReadBuildTag keys off the leading "v" to tell a
      # stamped build from an unstamped one, so the "v" is load-bearing; it displays
      # as e.g. 4.5.2301-dev.a1b2c3d.
      - name: Publish client
        run: dotnet publish ${{ env.CUO_PROJECT_PATH }} -c Release -o ${{ env.CUO_OUTPUT_PATH }} -p:IS_DEV_BUILD=true -p:HOLIDAY_DEV_BUILD=true -p:InformationalVersion=v${{ env.VERSION }}-dev.${{ env.SHORT_SHA }}

      - name: Place FNA native libraries next to the exe
        shell: pwsh
        run: |
          $dist = "${{ env.CUO_OUTPUT_PATH }}"
          $x64  = Join-Path $dist "x64"
          if (Test-Path $x64) {
            Copy-Item -Path (Join-Path $x64 '*') -Destination $dist -Force -Recurse
          }
          foreach ($dll in @('SDL2.dll', 'FNA3D.dll', 'FAudio.dll')) {
            if (-not (Test-Path (Join-Path $dist $dll))) {
              Write-Error "Required native library missing next to the exe: $dll"
              exit 1
            }
            Write-Host "Found native library: $dll"
          }
          if (-not (Test-Path (Join-Path $dist 'ClassicUO.exe'))) {
            Write-Error "ClassicUO.exe was not produced by the publish step."
            exit 1
          }

      - name: Create zip
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          directory: ${{ env.CUO_OUTPUT_PATH }}
          filename: ${{ env.CUO_ZIP_NAME }}
          exclusions: '*.zip'

      # There is deliberately no delete step here. Deleting and recreating a
      # release under a fixed tag is what burned "latest" and then "dev-latest":
      # each recreate publishes the name afresh, and one of those publishes
      # reserves it forever. allowUpdates edits the release that is already
      # there, and removeArtifacts drops the previous zip off it, which gets the
      # same rolling download without ever republishing the tag.
      # prerelease + makeLatest:false keep the "Latest" badge on the release
      # download, so nobody grabs a dev build by accident.
      - name: Publish dev release
        uses: ncipollo/release-action@v1.16.0
        with:
          artifacts: "${{ env.CUO_OUTPUT_PATH }}/${{ env.CUO_ZIP_NAME }}"
          name: "TazUO Holiday Edition (dev) - v${{ env.VERSION }} - ${{ env.BUILT_AT }} - ${{ env.SHORT_SHA }}"
          body: |
            **Testing build off the `legacy` branch. Not a release.**

            Unfinished and unconfirmed work lands here first. If you want the
            stable client, use the `latest` release instead.

            - Release this was cut from: `v${{ env.VERSION }}`
            - Build stamp: `v${{ env.VERSION }}-dev.${{ env.SHORT_SHA }}` (shown in-client and in crash logs)
            - Commit: ${{ env.DEV_SHA }}

            Download `${{ env.CUO_ZIP_NAME }}` below, unzip it, and run `ClassicUO.exe`.

            ${{ env.NOTES }}
          tag: ${{ env.TAG_NAME }}
          commit: ${{ env.DEV_SHA }}
          allowUpdates: true
          removeArtifacts: true
          makeLatest: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # allowUpdates rewrites the release and swaps the zip, but it will not
      # repoint a tag that already exists - so the tag stayed on the commit it
      # was first created from while the release moved on, and the release page
      # showed a commit that had nothing to do with the download.
      #
      # This is a ref move, not a release publish. A tag name is reserved
      # permanently by being PUBLISHED under an immutable release, which is what
      # the old delete-and-recreate step did and what burned "latest" and
      # "dev-latest". Moving a ref cannot do that, so this is safe to keep.
      - name: Point the dev-build tag at the commit that was built
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "repos/${{ github.repository }}/git/refs/tags/${{ env.TAG_NAME }}" \
            -f sha='${{ env.DEV_SHA }}' -F force=true \
            && echo "tag now at ${{ env.SHORT_SHA }}" \
            || echo "::warning::could not move ${{ env.TAG_NAME }}; the zip is still correct."
