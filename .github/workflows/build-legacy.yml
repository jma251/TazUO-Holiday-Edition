name: Build Legacy

# Builds the legacy (.NET Framework 4.7.2) client on a Windows runner and
# publishes the result as a downloadable zip attached to a GitHub release
# tagged "latest". Each run replaces the previous "latest" release and zip.

on:
  # Run automatically whenever the legacy branch is updated.
  push:
    branches: [legacy]
  # Allow starting a build by hand from the Actions tab.
  workflow_dispatch:

# Only one legacy build at a time; a newer push cancels an in-progress one.
concurrency:
  group: build-legacy
  cancel-in-progress: true

# Needed so the workflow can create/replace the "latest" release and tag.
permissions:
  contents: write

env:
  CUO_PROJECT_PATH: 'src/ClassicUO.Client/ClassicUO.Client.csproj'
  CUO_OUTPUT_PATH: 'bin/dist'
  CUO_ZIP_NAME: 'TazUO-Holiday-Edition.zip'
  TAG_NAME: 'latest'

  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Always build the legacy branch, whether triggered by push or by hand.
      # fetch-depth: 0 pulls full history and all tags. Both are required: the
      # Holiday increment is derived from existing tags, and the release notes
      # need the commit range since the previous Holiday tag.
      - name: Check out legacy branch
        uses: actions/checkout@v4
        with:
          ref: legacy
          fetch-depth: 0

      # Pull in FNA, MP3Sharp, etc. (and anything nested inside them).
      # The insteadOf rewrite lets old git:// submodule URLs clone over https.
      - name: Check out submodules (recursive)
        run: |
          git config --global url."https://".insteadOf git://
          git submodule update --init --recursive

      # Read the client version (e.g. 4.5.23) so we can label the release, and
      # record the exact legacy commit we built (a manual run may be dispatched
      # from a different branch, so github.sha is not reliable here).
      - name: Extract version and commit
        shell: bash
        run: |
          export LC_ALL=C.UTF-8
          echo "VERSION=$(grep -oP '<AssemblyVersion>\K\d+\.\d+\.\d+' src/ClassicUO.Client/ClassicUO.Client.csproj | head -1)" >> $GITHUB_ENV
          echo "LEGACY_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # The release version IS the assembly version in ClassicUO.Client.csproj.
      # Bumping that file is how a release is cut - nothing here auto-increments, so
      # merging to legacy without a bump refreshes "latest" and publishes no new
      # numbered release. That is deliberate: a release should be a decision.
      #
      # The scheme continues TazUO's numbering rather than restarting. Taz is on
      # 4.5.23; Holiday builds on top of that base read 4.5.23xx, so 4.5.2301 is the
      # first. Taz would have to reach patch 2301 to collide, and the base version
      # stays legible inside the number.
      - name: Resolve release tag
        shell: bash
        run: |
          export LC_ALL=C.UTF-8

          # Highest existing release tag, semver-ordered, ignoring the rolling
          # "latest"/"dev-latest" tags and the retired v<base>-hN series.
          PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -Ev -- '-h[0-9]+$' | sort -V | tail -1)
          echo "PREV_TAG=$PREV" >> $GITHUB_ENV

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::notice::v${VERSION} is already released. Refreshing 'latest' only."
            echo "::notice::To publish a new numbered release, raise <AssemblyVersion> in src/ClassicUO.Client/ClassicUO.Client.csproj."
            echo "SKIP_PERMANENT=true" >> $GITHUB_ENV
          else
            echo "SKIP_PERMANENT=false" >> $GITHUB_ENV
          fi

          echo "HOLIDAY_TAG=v${VERSION}" >> $GITHUB_ENV

      # Collect the commits since the previous Holiday build so each release's
      # notes read as a running list of what changed.
      - name: Build release notes
        shell: bash
        run: |
          export LC_ALL=C.UTF-8

          if [ -n "$PREV_TAG" ]; then
            HEADER="Changes since \`${PREV_TAG}\`:"
            LOG=$(git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD")
          else
            HEADER="Recent changes (first release of v${VERSION}):"
            LOG=$(git log --no-merges -20 --pretty=format:'- %s (%h)')
          fi

          if [ -z "$LOG" ]; then
            LOG="- No new commits since the previous build."
          fi

          {
            echo "NOTES<<HOLIDAY_NOTES_EOF"
            echo "$HEADER"
            echo ""
            echo "$LOG"
            echo "HOLIDAY_NOTES_EOF"
          } >> $GITHUB_ENV

      # The .NET 8 SDK can build/publish the net472 target on Windows.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Publish the client. IS_DEV_BUILD=true produces a windowed (WinExe) build.
      # The csproj's post-publish targets copy the native libs into bin/dist/x64.
      - name: Publish client
        # InformationalVersion carries the Holiday tag into the binary. The assembly
        # version is TazUO's and is identical in every Holiday build, so without this
        # a log or a screenshot cannot say which build produced it.
        run: dotnet publish ${{ env.CUO_PROJECT_PATH }} -c Release -o ${{ env.CUO_OUTPUT_PATH }} -p:IS_DEV_BUILD=true -p:InformationalVersion=${{ env.HOLIDAY_TAG }}

      # The client can load natives from the x64 subfolder, but to be safe we
      # also place SDL2/FNA3D/FAudio (and the rest) right next to ClassicUO.exe,
      # then fail the build if any of the three required natives is missing.
      - name: Place FNA native libraries next to the exe
        shell: pwsh
        run: |
          $dist = "${{ env.CUO_OUTPUT_PATH }}"
          $x64  = Join-Path $dist "x64"
          if (Test-Path $x64) {
            Copy-Item -Path (Join-Path $x64 '*') -Destination $dist -Force -Recurse
          }
          foreach ($dll in @('SDL2.dll', 'FNA3D.dll', 'FAudio.dll')) {
            if (-not (Test-Path (Join-Path $dist $dll))) {
              Write-Error "Required native library missing next to the exe: $dll"
              exit 1
            }
            Write-Host "Found native library: $dll"
          }
          if (-not (Test-Path (Join-Path $dist 'ClassicUO.exe'))) {
            Write-Error "ClassicUO.exe was not produced by the publish step."
            exit 1
          }

      # Zip everything in bin/dist (exe, dlls, natives, data) into one archive.
      - name: Create zip
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          directory: ${{ env.CUO_OUTPUT_PATH }}
          filename: ${{ env.CUO_ZIP_NAME }}
          exclusions: '*.zip'

      # Permanent, numbered release. Never updated, never deleted - these
      # accumulate to form the rollback history. makeLatest is false so the
      # "Latest" badge stays on the "latest" release below.
      - name: Publish permanent Holiday release
        if: env.SKIP_PERMANENT == 'false'
        uses: ncipollo/release-action@v1.16.0
        with:
          artifacts: "${{ env.CUO_OUTPUT_PATH }}/${{ env.CUO_ZIP_NAME }}"
          name: "TazUO Holiday Edition ${{ env.HOLIDAY_TAG }}"
          body: |
            Permanent release off the `legacy` branch (.NET Framework 4.7.2).

            - Version: `${{ env.HOLIDAY_TAG }}`
            - Commit: ${{ env.LEGACY_SHA }}

            Download `${{ env.CUO_ZIP_NAME }}` below, unzip it, and run `ClassicUO.exe`.

            ${{ env.NOTES }}
          tag: ${{ env.HOLIDAY_TAG }}
          commit: ${{ env.LEGACY_SHA }}
          allowUpdates: false   # these are immutable once published
          makeLatest: false     # the "latest" release keeps the badge
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Remove the previous "latest" release and its tag so the new one is
      # created fresh against this commit. Ignored if there isn't one yet.
      # Only the "latest" tag is touched - Holiday tags are never deleted.
      - name: Delete previous "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ env.TAG_NAME }}" --yes --cleanup-tag || echo "No previous release to delete."

      # Create the single "latest" release with the freshly built zip.
      - name: Publish "latest" release
        uses: ncipollo/release-action@v1.16.0
        with:
          artifacts: "${{ env.CUO_OUTPUT_PATH }}/${{ env.CUO_ZIP_NAME }}"
          name: "TazUO Holiday Edition (latest) - ${{ env.HOLIDAY_TAG }}"
          body: |
            Automated build of the `legacy` branch (.NET Framework 4.7.2).
            This release always points at the newest build; its download URL never changes.

            - Version: `${{ env.HOLIDAY_TAG }}`
            - Permanent copy, for rollback: `${{ env.HOLIDAY_TAG }}`
            - Commit: ${{ env.LEGACY_SHA }}

            Download `${{ env.CUO_ZIP_NAME }}` below, unzip it, and run `ClassicUO.exe`.

            ${{ env.NOTES }}
          tag: ${{ env.TAG_NAME }}
          commit: ${{ env.LEGACY_SHA }}
          allowUpdates: true      # reuse the existing "latest" release
          removeArtifacts: true   # drop the old zip before attaching the new one
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
